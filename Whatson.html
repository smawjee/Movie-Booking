<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>What's On – Cinego</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="whatson.css"/>
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 🌐 Navbar -->
  <nav class="navbar">
    <div class="logo">
      <a href="index.html">
        <img src="cinego-logo.png" alt="Cinego Logo" class="logo-img"/>
      </a>
    </div>
    <ul class="nav-links">
      <li><a href="whatson.html" class="active">What's On</a></li>
      <li><a href="#">Trailers</a></li>
      <li><a href="Manage-membership.html">Membership</a></li>
      <li><a href="food-drink.html">Food & Drinks</a></li>
    </ul>
    <div class="nav-auth">
      <a href="login.html" class="nav-btn">Login</a>
      <a href="join-membership.html" class="nav-btn join">Join</a>
    </div>
    <button id="openSearchBtn" class="search-icon" aria-label="Search">
      <i class="fas fa-search"></i>
    </button>
  </nav>

  <!-- 🎥 Trailer Slideshow -->
  <section class="trailer-slideshow">
    <div class="slideshow-wrapper">
      <button class="nav-arrow left-arrow" onclick="prevSlide()">&#10094;</button>
      <div class="slideshow-track" id="trailerSlideshow"></div>
      <button class="nav-arrow right-arrow" onclick="nextSlide()">&#10095;</button>
    </div>
  </section>

  <!-- 🎬 Featured Movie Banner -->
  <section class="featured-banner" id="featuredBanner"></section>

  <!-- 🎞️ What's On Section -->
  <main class="content">
    <section>
      <div class="movie-section-header">
        <h2>Now Showing</h2>
        <div class="controls-group-right">
          <div class="cinema-selector">
            <label for="cinemaSelect">Cinema:</label>
            <select id="cinemaSelect">
              <option value="edinburgh">Edinburgh</option>
              <option value="glasgow">Glasgow</option>
              <option value="london">London</option>
            </select>
          </div>
          <button class="filter-btn" id="filterToggleBtn"><i class="fas fa-sliders-h"></i> Filter</button>
        </div>
      </div>

      <!-- 🎯 Filter Panel -->
      <div class="filter-panel" id="filterDropdown">
        <!-- Genre Filter -->
        <div class="filter-group">
          <h4>Filter by Genre</h4>
          <div class="filter-buttons" id="genreFilters">
            <button data-genre="Action">Action</button>
            <button data-genre="Adventure">Adventure</button>
            <button data-genre="Animation">Animation</button>
            <button data-genre="Comedy">Comedy</button>
            <button data-genre="Crime">Crime</button>
            <button data-genre="Documentary">Documentary</button>
            <button data-genre="Drama">Drama</button>
            <button data-genre="Family">Family</button>
            <button data-genre="Fantasy">Fantasy</button>
            <button data-genre="History">History</button>
            <button data-genre="Horror">Horror</button>
            <button data-genre="Music">Music</button>
            <button data-genre="Mystery">Mystery</button>
            <button data-genre="Romance">Romance</button>
            <button data-genre="Science Fiction">Science Fiction</button>
            <button data-genre="TV Movie">TV Movie</button>
            <button data-genre="Thriller">Thriller</button>
            <button data-genre="War">War</button>
            <button data-genre="Western">Western</button>
          </div>
        </div>

        <!-- Language Filter -->
        <div class="filter-group">
          <h4>Filter by Language</h4>
          <div class="filter-buttons" id="languageFilters">
            <button data-lang="en">English</button>
            <button data-lang="ur">Urdu</button>
            <button data-lang="hi">Hindi</button>
            <button data-lang="fr">French</button>
            <button data-lang="es">Spanish</button>
            <button data-lang="ta">Tamil</button>
            <button data-lang="te">Telugu</button>
            <button data-lang="ml">Malayalam</button>
            <button data-lang="ge">German</button>
          </div>
        </div>

        <!-- Age Rating Filter -->
        <div class="filter-group">
          <h4>Filter by Age Rating</h4>
          <div class="filter-buttons" id="ageFilters">
            <button data-age="U">U</button>
            <button data-age="PG">PG</button>
            <button data-age="12A">12A</button>
            <button data-age="15">15</button>
            <button data-age="18">18</button>
          </div>
        </div>
      </div>

      <!-- 🎦 Movie Cards -->
      <div id="whatsonList" class="movie-list"></div>
    </section>
  </main>

  <!-- 🔍 Search Overlay -->
  <div id="searchOverlay" class="overlay">
    <div class="search-box">
      <input id="searchInput" placeholder="Search for a movie, offer, or snack..." />
      <div class="search-buttons">
        <button onclick="searchMovies()" aria-label="Search"><i class="fas fa-search"></i></button>
        <button id="closeSearchBtn" aria-label="Close"><i class="fas fa-times"></i></button>
      </div>
    </div>
  </div>

  <!-- 🔻 Footer -->
  <footer class="site-footer">
    <div class="footer-columns">
      <div>
        <h4>Get In Touch</h4>
        <ul>
          <li><a href="#">FAQs</a></li>
          <li><a href="#">Feedback</a></li>
        </ul>
      </div>
      <div>
        <h4>About</h4>
        <ul>
          <li><a href="#">Food & Drinks</a></li>
          <li><a href="#">Offers</a></li>
          <li><a href="#">Careers</a></li>
        </ul>
      </div>
      <div>
        <h4>Legal</h4>
        <ul>
          <li><a href="#">Privacy Policy</a></li>
          <li><a href="#">Terms & Conditions</a></li>
        </ul>
      </div>
      <div>
        <h4>Social</h4>
        <div class="social-icons">
          <a href="#"><i class="fab fa-facebook"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fab fa-youtube"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    document.getElementById('openSearchBtn').onclick = () =>
      document.getElementById('searchOverlay').style.display = 'flex';

    document.getElementById('closeSearchBtn').onclick = () =>
      document.getElementById('searchOverlay').style.display = 'none';

    document.getElementById("filterToggleBtn").onclick = () => {
      const dropdown = document.getElementById("filterDropdown");
      dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
    };
  </script>

  <script src="whatson.js"></script>
  <script src="searchmovies.js"></script>
  <script src="trailers.js" defer></script>
  <script src="auth.js"></script>
</body>
</html>
