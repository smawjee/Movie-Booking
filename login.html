<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login to Cinego</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    /* Modal styles */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .hidden { display: none; }
    .modal-content {
      background: #1f1f1f;
      border-radius: 8px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      position: relative;
      color: #eee;
      font-family: 'Poppins', sans-serif;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    }
    .modal-content h3 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #ffc107;
    }
    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
    }
    .modal-content button {
      background: #facc15;
      color: #111;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 8px;
      width: 100%;
    }
    .modal .close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: transparent;
      border: none;
      font-size: 1.2rem;
      color: #ccc;
      cursor: pointer;
    }
    .error-small {
      color: #ff7373;
      font-size: 0.85rem;
      margin: 4px 0 0;
    }
    .success-small {
      color: #7ed957;
      font-size: 0.9rem;
      margin: 8px 0 0;
    }
  </style>
</head>
<body>

  <!-- 🌐 Navbar -->
  <nav class="navbar">
    <div class="logo">
      <a href="index.html">
        <img src="cinego-logo.png" alt="Cinego Logo" class="logo-img"/>
      </a>
    </div>
    <ul class="nav-links">
      <li><a href="whatson.html">What's On</a></li>
      <li><a href="#">Trailers</a></li>
      <li><a href="Manage-membership.html">Membership</a></li>
      <li><a href="food-drink.html">Food & Drinks</a></li>
    </ul>
    <div class="nav-auth">
      <a href="login.html" class="nav-btn login active">Login</a>
      <a href="join-membership.html" class="nav-btn join">Join</a>
      <button id="openSearchBtn" class="search-icon" aria-label="Search">
        <i class="fas fa-search"></i>
      </button>
    </div>
  </nav>

  <!-- 🔐 Login Form Section -->
  <div class="login-container">
    <header class="login-header">
      <img src="cinego-logo.png" alt="Cinego Logo" class="form-logo"/>
      <h2>Welcome Back</h2>
      <p>Log in to continue booking, watching, and enjoying Cinego.</p>
    </header>

    <form class="login-form" id="loginForm">
      <div class="form-group">
        <input type="email" id="loginEmail" placeholder="Email Address" required />
      </div>
      <div class="form-group">
        <input type="password" id="loginPassword" placeholder="Password" required />
      </div>
      <div class="form-group remember-group">
        <input type="checkbox" id="rememberMe" />
        <label for="rememberMe">Remember Me</label>
        <a href="#" class="forgot-password" id="forgotPassword">Forgot Password?</a>
      </div>
      <div class="form-group">
        <button type="submit">Login</button>
      </div>
      <p id="loginError" class="error-message" style="display: none; color: #ff3c3c;"></p>
      <p class="join-link">Not a member? <a href="join-membership.html">Join Cinego</a></p>
    </form>
  </div>

  <!-- 🔍 Search Overlay -->
  <div id="searchOverlay" class="overlay">
    <div class="search-box">
      <input id="searchInput" placeholder="Search for a movie, offer, or snack..." />
      <div class="search-buttons">
        <button onclick="searchMovies()" aria-label="Search"><i class="fas fa-search"></i></button>
        <button id="closeSearchBtn" aria-label="Close"><i class="fas fa-times"></i></button>
      </div>
    </div>
  </div>

  <!-- 🔁 Forgot Password Modal (simplified, no code) -->
  <div id="forgotModal" class="modal hidden" aria-modal="true" role="dialog">
    <div class="modal-content">
      <button class="close" aria-label="Close">&times;</button>
      <h3>Reset Password</h3>
      <div class="form-group">
        <input type="email" id="resetEmail" placeholder="Your Email" required />
        <p id="resetEmailError" class="error-small" style="display:none;"></p>
      </div>
      <div class="form-group">
        <input type="password" id="newPassword" placeholder="New Password" required />
        <p id="newPasswordError" class="error-small" style="display:none;"></p>
      </div>
      <div class="form-group">
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
        <p id="confirmPasswordError" class="error-small" style="display:none;"></p>
      </div>
      <button id="resetSubmitBtn">Update Password</button>
      <p id="resetSuccess" class="success-small" style="display:none;">Password updated! You can now log in.</p>
    </div>
  </div>

  <script src="login.js"></script>
  <script>
    document.getElementById('openSearchBtn').onclick = () =>
      document.getElementById('searchOverlay').style.display = 'flex';

    document.getElementById('closeSearchBtn').onclick = () =>
      document.getElementById('searchOverlay').style.display = 'none';
  </script>
  <script src="auth.js"></script>

</body>
</html>
