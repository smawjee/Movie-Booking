<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking Confirmation – Cinego</title>
  <link rel="stylesheet" href="confirmation.css" />
  <link rel="icon" href="cinego-logo.png" type="image/png" />
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
</head>
<body>

<main class="confirmation-container" aria-label="Booking confirmation">
  <h2>🎉 Booking Confirmed!</h2>
  <p>Thank you for booking with Cinego.</p>

  <section class="ticket-box">
    <img id="confirmedPoster" src="" alt="Movie Poster" class="ticket-poster"
         onerror="this.onerror=null; this.src='fallback.jpg'; this.alt='No poster available';" />
    
    <div class="ticket-info">
      <h3 id="confirmedMovieTitle">Movie Title</h3>
      <p id="ticketMembership" class="ticket-membership" style="display: none;"></p>

      <p><strong>Date:</strong> <span id="ticketDate">-</span></p>
      <p><strong>Details:</strong> <span id="confirmedScreenInfo">-</span></p>
      <p><strong>Language:</strong> <span id="ticketLang">-</span></p>
      <p><strong>Runtime:</strong> <span id="ticketRuntime">-</span></p>
      <p><strong>Seats:</strong> <span id="confirmedSeats">-</span></p>
      <p><strong>Total Paid:</strong> £<span id="confirmedTotal">0.00</span></p>
    </div>
  </section>

  <div class="qr-section">
    <p>🎟️ Show this QR code at the cinema:</p>
    <canvas id="qrCodeCanvas"></canvas>
  </div>

  <button onclick="window.location.href='manage-bookings.html'" class="view-bookings-btn">
    Manage Bookings
  </button>
</main>

<script type="module">
  document.addEventListener("DOMContentLoaded", () => {
    const raw = localStorage.getItem("lastBooking");
    if (!raw) return window.location.href = "index.html";

    let booking;
    try {
      booking = JSON.parse(raw);
    } catch {
      return window.location.href = "index.html";
    }

    // Poster
    const posterEl = document.getElementById("confirmedPoster");
    if (booking.poster) {
      posterEl.src = booking.poster.startsWith("http")
        ? booking.poster
        : `https://image.tmdb.org/t/p/w500${booking.poster}`;
      posterEl.alt = `${booking.movie} Poster`;
    }

    // Title
    document.getElementById("confirmedMovieTitle").textContent =
      booking.movie || "Unknown Movie";

    // Date
    const dateEl = document.getElementById("ticketDate");
    if (booking.date) {
      const dt = new Date(booking.date);
      dateEl.textContent = dt.toLocaleString("en-GB", {
        day:   "2-digit",
        month: "short",
        year:  "numeric",
        hour:  "2-digit",
        minute:"2-digit"
      });
    } else {
      dateEl.textContent = "N/A";
    }

    // Details
    const infoEl = document.getElementById("confirmedScreenInfo");
    infoEl.textContent = `Screen ${booking.screen} • ${booking.start} – ${booking.end} • ${booking.format || "Standard"}`;

    // // ——— LANGUAGE ———
    // let lang = booking.language || "Unknown";
    // // if it's a 2‑letter ISO code, turn it into full English name:
    // if (/^[a-z]{2,3}$/i.test(lang) && Intl.DisplayNames) {
    //   const dn = new Intl.DisplayNames(['en'], { type: 'language' });
    //   lang = dn.of(lang.toLowerCase()) || lang;
    // }
    // document.getElementById("ticketLang").textContent = lang;

    // ——— RUNTIME ———
    document.getElementById("ticketLang").textContent =
  booking.language || "Unknown";

// 7) Runtime (already humanized "Xh Ym"):
document.getElementById("ticketRuntime").textContent =
  booking.runtime || "N/A";

    // Seats
    const seatsEl = document.getElementById("confirmedSeats");
    if (Array.isArray(booking.seats) && booking.seats.length) {
      seatsEl.textContent = booking.seats
        .map(s =>
          s.seatNumber
            ? `${s.seatNumber} (${s.tier}) – £${parseFloat(s.price).toFixed(2)}`
            : s
        )
        .join(", ");
    } else {
      seatsEl.textContent = "None";
    }

    // Total Paid
    document.getElementById("confirmedTotal").textContent = parseFloat(
      booking.totalPaid || 0
    ).toFixed(2);

    // Membership
    if (booking.membershipCode) {
      const m = document.getElementById("ticketMembership");
      m.textContent = `Membership Code: ${booking.membershipCode}`;
      m.style.display = "block";
    }

    // QR
    const qrData = `
Movie: ${booking.movie}
Date:  ${new Date(booking.date).toLocaleString([],{
  dateStyle:"medium",timeStyle:"short"})}
Screen: ${booking.screen}
Time:   ${booking.start} – ${booking.end}
Format: ${booking.format}
Language: ${lang}
Runtime: ${runText}
Seats:  ${seatsEl.textContent}
Paid:   £${parseFloat(booking.totalPaid).toFixed(2)}
    `.trim();

    new QRious({
      element: document.getElementById("qrCodeCanvas"),
      value: qrData,
      size: 200
    });
  });
</script>
<script src="paymentModal.js"></script>
</body>
</html>
