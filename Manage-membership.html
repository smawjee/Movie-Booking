
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Membership</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="manage-membership.css" />
  <style>
    body { background: #111; color: #eee; font-family: 'Poppins', sans-serif; margin: 0; }
    .container {
      max-width: 600px; margin: 60px auto; padding: 40px;
      background: #1f1f1f; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 { text-align: center; font-size: 2rem; margin-bottom: 24px; color: #fff; }

    #membershipInfo p { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 12px 0; margin: 0; }
    #membershipInfo p:last-child { border: none; }
    #membershipInfo strong { color: #ccc; }

    .actions { text-align: center; margin-top: 20px; }
    .actions button { padding: 12px 28px; margin: 0 5px; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; }
    #changePaymentBtn,#changeTierBtn { background: #ffc107; color: #111; }
    #cancelMembershipBtn { background: #dc3545; color: #fff; }

    form { background: #2a2a2a; padding: 20px; border-radius: 6px; margin-top: 20px; }
    form input,form select {
      width: 100%; background: #333; border: 1px solid #444;
      padding: 10px; margin-bottom: 12px; color: #fff; border-radius: 4px; letter-spacing: 1px;
    }
    form button { background: #007bff; color: #fff; border: none; padding: 10px 24px; border-radius: 4px; }
    form button#cancelFormBtn, form button#cancelTierBtn { background: #555; }
    .hidden { display: none; }

    .dropdown { position: relative; display: inline-block; }
    .dropdown-content {
      display: none; position: absolute; right: 0;
      background: #1f1f1f; min-width: 160px; z-index: 10; border-radius: 4px;
    }
    .dropdown-content a, .dropdown-content button {
      display: block; padding: 10px; color: #fff; text-align: left;
      background: transparent; border: none; width: 100%; cursor: pointer;
    }
    .dropdown:hover .dropdown-content { display: block; }

    #noMembership a button {
      margin-top: 15px; padding: 12px 24px;
      background: #ffc107; color: #111;
      border: none; border-radius: 6px;
      font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><a href="index.html"><img src="cinego-logo.png" class="logo-img" /></a></div>
    <ul class="nav-links">
      <li><a href="whatson.html">What's On</a></li>
      <li><a href="#">Trailers</a></li>
      <li><a href="manage-membership.html" class="active">Membership</a></li>
      <li><a href="food-drink.html">Food & Drinks</a></li>
    </ul>
    <div class="nav-auth" id="navAuth"></div>
  </nav>

  <div class="container">
    <h1>Manage Membership</h1>

    <div id="noMembership" class="hidden">
      <p>You do not have an active membership.</p>
      <a href="join-membership.html">
        <button>Join Membership</button>
      </a>
    </div>

    <div id="membershipInfo" class="hidden">
      <p><strong>Name:</strong> <span id="memberName"></span></p>
      <p><strong>Email:</strong> <span id="memberEmail"></span></p>
      <p><strong>Membership ID:</strong> <span id="memberId"></span></p>
      <p><strong>Tier:</strong> <span id="memberTier"></span></p>
      <p><strong>Payment:</strong> <span id="paymentMethod"></span></p>
    </div>

    <div class="actions">
      <button id="changePaymentBtn" class="hidden">Change Payment</button>
      <button id="changeTierBtn" class="hidden">Change Tier</button>
      <button id="cancelMembershipBtn" class="hidden">Cancel Membership</button>
    </div>

    <form id="paymentForm" class="hidden">
      <h2>Update Payment Details</h2>
      <input type="text" id="newCard" placeholder="Card Number" maxlength="19" required>
      <input type="text" id="newExpiry" placeholder="MM/YY" maxlength="5" required>
      <input type="text" id="newCvv" placeholder="CVV" maxlength="3" required>
      <button type="submit">Save</button>
      <button type="button" id="cancelFormBtn">Cancel</button>
    </form>

    <form id="tierForm" class="hidden">
      <h2>Change Membership Tier</h2>
      <select id="newTier">
        <option value="Silver">Silver</option>
        <option value="Gold">Gold</option>
        <option value="Platinum">Platinum</option>
      </select>
      <button type="button" id="saveTierBtn">Save</button>
      <button type="button" id="cancelTierBtn">Cancel</button>
    </form>
  </div>

  <footer class="footer">
    <p>&copy; 2025 Cinego. All rights reserved.</p>
  </footer>

  <script src="auth.js"></script>
  <script>
    const navAuth = document.getElementById('navAuth');
    const logged = JSON.parse(localStorage.getItem('loggedInUser') || '{}');
    if (logged.firstName) {
      navAuth.innerHTML = `
        <div class="dropdown">
          <span>Welcome, ${logged.firstName} ▼</span>
          <div class="dropdown-content">
            <a href="manage-bookings.html">Manage Bookings</a>
            <button onclick="logout()">Sign Out</button>
          </div>
        </div>`;
    } else {
      navAuth.innerHTML = `<a href="login.html">Login</a> <a href="join.html">Join</a>`;
    }
    window.logout = () => { localStorage.removeItem('loggedInUser'); location.reload(); };

    function getCurrentUser() {
      const users = JSON.parse(localStorage.getItem('cinegoUsers') || '[]');
      return users.find(u => u.email === logged.email) || {};
    }
    function saveUser(u) {
      const users = JSON.parse(localStorage.getItem('cinegoUsers') || '[]');
      const idx = users.findIndex(x => x.email === u.email);
      if (idx >= 0) users[idx] = u;
      localStorage.setItem('cinegoUsers', JSON.stringify(users));
    }
    function maskCard(num) {
      let digits = num.replace(/\D/g, '');
      digits = digits.replace(/(\d{4})(?=\d)/g, '$1 ');
      const parts = digits.split(' ');
      return parts.map((grp, i) => i < parts.length -1 ? '****' : grp).join(' ');
    }

    document.getElementById('newCard').addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '').replace(/(\d{4})(?=\d)/g, '$1 ').trim();
    });
    document.getElementById('newExpiry').addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '').replace(/(\d{2})(\d{1,2})/, '$1/$2').slice(0,5);
    });
    document.getElementById('newCvv').addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0,3);
    });

    const changePayBtn = document.getElementById('changePaymentBtn');
    const changeTierBtn = document.getElementById('changeTierBtn');
    const cancelBtn = document.getElementById('cancelMembershipBtn');
    const payForm = document.getElementById('paymentForm');
    const tierForm = document.getElementById('tierForm');
    const cancelFormBtn = document.getElementById('cancelFormBtn');
    const saveTierBtn = document.getElementById('saveTierBtn');
    const cancelTierBtn = document.getElementById('cancelTierBtn');

    function refreshUI() {
      const user = getCurrentUser();
      const has = Boolean(user.membershipId);

      document.getElementById('noMembership').classList.toggle('hidden', has);
      document.getElementById('membershipInfo').classList.toggle('hidden', !has);
      changePayBtn.classList.toggle('hidden', !has);
      changeTierBtn.classList.toggle('hidden', !has);
      cancelBtn.classList.toggle('hidden', !has);

      if (has) {
        document.getElementById('memberName').textContent = user.name || logged.firstName || '—';
        document.getElementById('memberEmail').textContent = user.email;
        document.getElementById('memberId').textContent = user.membershipId;
        document.getElementById('memberTier').textContent = user.membershipTier;

        let displayCard = 'Not set';
        if (user.paymentMethod && user.paymentMethod.card) {
          displayCard = maskCard(user.paymentMethod.card) + '  •  exp ' + user.paymentMethod.expiry;
        } else {
          const savedCard = JSON.parse(localStorage.getItem('membershipCard') || '{}');
          if (savedCard.card && savedCard.expiry) {
            displayCard = '**** ' + savedCard.card + '  •  exp ' + savedCard.expiry;
          }
        }
        document.getElementById('paymentMethod').textContent = displayCard;
      }
    }

    changePayBtn.addEventListener('click', () => {
      tierForm.classList.add('hidden');
      payForm.classList.remove('hidden');
    });

    cancelBtn.addEventListener('click', () => {
      if (confirm('Are you sure you want to cancel and remove your membership completely?')) {
        const users = JSON.parse(localStorage.getItem('cinegoUsers') || '[]');
        const filtered = users.filter(u => u.email !== logged.email);
        localStorage.setItem('cinegoUsers', JSON.stringify(filtered));
        localStorage.removeItem('loggedInUser');
        alert('Membership and profile removed. Please rejoin.');
        location.reload();
      }
    });

    payForm.addEventListener('submit', e => {
      e.preventDefault();
      const card = document.getElementById('newCard').value.trim();
      const expiry = document.getElementById('newExpiry').value.trim();
      const cvv = document.getElementById('newCvv').value.trim();
      const digits = card.replace(/\D/g, '');
      if (digits.length !== 16) return alert('Enter a valid 16-digit card number.');
      if (!expiry.match(/^(0[1-9]|1[0-2])\/\d{2}$/)) return alert('Enter expiry as MM/YY.');
      if (cvv.length !== 3) return alert('Enter a valid 3-digit CVV.');

      const u = getCurrentUser();
      u.paymentMethod = { card, expiry, cvv };
      saveUser(u);
      payForm.classList.add('hidden');
      refreshUI();
      alert('Payment updated');
    });

    cancelFormBtn.addEventListener('click', () => payForm.classList.add('hidden'));
    changeTierBtn.addEventListener('click', () => {
      payForm.classList.add('hidden');
      tierForm.classList.remove('hidden');
    });
    cancelTierBtn.addEventListener('click', () => tierForm.classList.add('hidden'));
    saveTierBtn.addEventListener('click', () => {
      const newTier = document.getElementById('newTier').value;
      const u = getCurrentUser();
      u.membershipTier = newTier;
      saveUser(u);
      tierForm.classList.add('hidden');
      refreshUI();
      alert('Tier updated');
    });

    refreshUI();
  </script>
</body>
</html>
