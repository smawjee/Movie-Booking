<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cinego – Trailers</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="trailers.css" />
  <style>
    /* Minimal overrides in case styling missing */
    body {
      background: #121212;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
    }
    
    .logo a {
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      font-size: 1.25rem;
    }
    
    header h1 {
      margin: 0;
      font-size: 2rem;
    }
    main {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .trailers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px,1fr));
      gap: 24px;
      margin-top: 16px;
    }
    .trailer-card {
      background: #1f1f1f;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
    }
    .video-wrapper iframe {
      position: absolute;
      top:0; left:0;
      width:100%;
      height:100%;
      border:0;
      border-radius: 0 0 10px 10px;
    }
    .trailer-info {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .trailer-info h3 {
      margin: 0;
      font-size: 1.1rem;
      flex: 1;
      color: #ffc107;
    }
    .rating-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .badge-u { background:#28a745; color:#fff; }
    .badge-pg { background:#17a2b8; color:#fff; }
    .badge-12 { background:#ffc107; color:#111; }
    .badge-15 { background:#fd7e14; color:#111; }
    .badge-18 { background:#dc3545; color:#fff; }
    .badge-nr { background:#6c757d; color:#fff; }

    .no-trailers {
      text-align:center;
      color:#aaa;
      font-size:1.2rem;
      grid-column:1/-1;
      padding:40px 0;
    }
    footer {
      text-align:center;
      padding:20px;
      background:#111;
      color:#aaa;
      margin-top:60px;
    }
    .dropdown { position: relative; display:inline-block; }
    .dropdown-content {
      display:none;
      position:absolute;
      right:0;
      background:#1f1f1f;
      border:1px solid #333;
      border-radius:6px;
      padding:8px 0;
      min-width:160px;
      z-index:10;
    }
    .dropdown:hover .dropdown-content { display:block; }
    .dropdown-content a, .dropdown-content button {
      display:block;
      width:100%;
      background:transparent;
      border:none;
      text-align:left;
      padding:8px 16px;
      color:#fff;
      cursor:pointer;
    }
    .dropdown-content a:hover, .dropdown-content button:hover { background:#272727; }
  </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">
      <a href="index.html">
        <img src="cinego-logo.png" alt="Cinego Logo" class="logo-img"/>
      </a>
    </div>
    <ul class="nav-links">
      <li><a href="whatson.html">What's On</a></li>
      <li><a href="#">Trailers</a></li>
      <li><a href="Manage-membership.html">Membership</a></li>
      <li><a href="food-drink.html" class="active">Food & Drinks</a></li>
    </ul>
    <div class="nav-auth">
      <a href="login.html" class="nav-btn">Login</a>
      <a href="join-membership.html" class="nav-btn join">Join</a>
    </div>
    <button id="openSearchBtn" class="search-icon" aria-label="Search">
      <i class="fas fa-search"></i>
    </button>
  </nav>

  <header>
    <h1>🎬 Now Showing Trailers</h1>
  </header>

  <main>
    <div id="trailersContainer" class="trailers-grid">
      <p class="no-trailers" id="loadingMsg">Loading trailers...</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Cinego. All rights reserved.</p>
  </footer>

  <!-- Auth UI -->
  <script>
    const navAuth = document.getElementById('navAuth');
    const logged = JSON.parse(localStorage.getItem('loggedInUser') || '{}');
    if (logged.firstName) {
      navAuth.innerHTML = `
        <div class="dropdown">
          <span style="color:#fff;cursor:pointer;">Welcome, ${logged.firstName} ▼</span>
          <div class="dropdown-content">
            <a href="manage-bookings.html">Manage Bookings</a>
            <button onclick="logout()">Sign Out</button>
          </div>
        </div>`;
    } else {
      navAuth.innerHTML = `<a href="login.html" style="color:#fff; margin-right:8px;">Login</a><a href="join.html" style="color:#fff;">Join</a>`;
    }
    window.logout = () => { localStorage.removeItem('loggedInUser'); location.reload(); };

    function getBadgeClass(r) {
      const v = (r || "").toUpperCase();
      if (v === "U") return "badge-u";
      if (v === "PG") return "badge-pg";
      if (v === "12" || v === "12A") return "badge-12";
      if (v === "15") return "badge-15";
      if (v === "18") return "badge-18";
      return "badge-nr";
    }
  </script>

  <!-- Trailer loader with backend + fallback to TMDB -->
  <script>
    const trailersContainer = document.getElementById("trailersContainer");
    const loadingMsg = document.getElementById("loadingMsg");

    async function fetchFromBackend() {
      const backendUrlCandidates = [
        "/api/movies/trailers",
        "http://localhost:5000/api/movies/trailers"
      ];
      for (const url of backendUrlCandidates) {
        try {
          const res = await fetch(url);
          if (!res.ok) {
            console.warn("Backend trailers fetch failed:", url, res.status);
            continue;
          }
          const data = await res.json();
          if (Array.isArray(data) && data.length) return data;
        } catch (e) {
          console.warn("Backend fetch error for", url, e);
        }
      }
      return null;
    }

    // fallback to TMDB directly if backend fails
    async function fetchFromTMDBDirect() {
      // Replace with your actual key; exposing in client is a tradeoff.
      const API_KEY = "YOUR_TMDB_API_KEY"; // <<-- put your TMDb key here
      const BASE = "https://api.themoviedb.org/3";

      async function getCertification(movieId) {
        try {
          const r = await fetch(`${BASE}/movie/${movieId}/release_dates?api_key=${API_KEY}`);
          const d = await r.json();
          const uk = d.results.find(r => r.iso_3166_1 === "GB");
          if (uk) {
            const rated = uk.release_dates.find(en => en.certification && en.certification.trim() !== "");
            return rated?.certification || "NR";
          }
        } catch {}
        return "NR";
      }

      try {
        const now = await fetch(`${BASE}/movie/now_playing?api_key=${API_KEY}&language=en-GB&page=1&region=GB`).then(r => r.json());
        const movies = (now.results || []).slice(0,5);
        const trailers = await Promise.all(movies.map(async m => {
          const vids = await fetch(`${BASE}/movie/${m.id}/videos?api_key=${API_KEY}&language=en-GB`).then(r => r.json());
          const trailer = (vids.results || []).find(v => v.site === "YouTube" && v.type === "Trailer");
          if (!trailer) return null;
          const rating = await getCertification(m.id);
          return {
            id: m.id,
            title: m.title,
            trailerUrl: `https://www.youtube.com/embed/${trailer.key}`,
            rating
          };
        }));
        return trailers.filter(Boolean);
      } catch (e) {
        console.error("TMDB direct fetch failed", e);
        return null;
      }
    }

    async function render() {
      trailersContainer.innerHTML = ""; // clear placeholder
      let trailers = await fetchFromBackend();
      if (!trailers) {
        console.info("Falling back to TMDB direct fetch");
        trailers = await fetchFromTMDBDirect();
      }

      if (!Array.isArray(trailers) || trailers.length === 0) {
        trailersContainer.innerHTML = `<p class="no-trailers">No trailers available right now.</p>`;
        return;
      }

      for (const t of trailers) {
        const card = document.createElement("div");
        card.className = "trailer-card";
        card.innerHTML = `
          <div class="video-wrapper">
            <iframe 
              src="${t.trailerUrl}" 
              title="${t.title} Trailer" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen
              loading="lazy"
            ></iframe>
          </div>
          <div class="trailer-info">
            <h3>${t.title}</h3>
            <span class="rating-badge ${getBadgeClass(t.rating)}">${t.rating || "NR"}</span>
          </div>
        `;
        trailersContainer.appendChild(card);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      render();
    });
  </script>
  <script src="main.js" defer></script>
  <script src="searchmovies.js"></script>
  <script src="auth.js"></script>
</body>
</html>
